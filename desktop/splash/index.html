<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pixel Reconstruction</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #f6f4ef; color: #171c23;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  .box { text-align: center; }
  .mark { width: 76px; height: 76px; color: #087bf0; animation: breathe 1.8s ease-in-out infinite; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin: 18px 0 6px; }
  p { font-size: 13px; color: #68717e; margin: 0; min-height: 20px; }
  button { margin-top: 18px; padding: 9px 22px; border: 0; border-radius: 99px; background: #171c23;
    color: #fff; font: inherit; font-size: 13px; cursor: pointer; display: none; }
  .offline .mark { animation: none; opacity: .5; }
  .offline button { display: inline-block; }
  @keyframes breathe { 50% { transform: scale(.94); opacity: .75; } }
  @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
</style>
</head>
<body>
<div class="box">
  <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <rect x="4" y="12" width="9" height="9" rx="1.5" fill="currentColor" opacity=".36"/>
    <rect x="17" y="5" width="9" height="9" rx="1.5" fill="currentColor" opacity=".64"/>
    <rect x="4" y="27" width="9" height="9" rx="1.5" fill="currentColor" opacity=".64"/>
    <rect x="4" y="42" width="9" height="9" rx="1.5" fill="currentColor"/>
    <path d="M37 12 58 24V47L37 59 17 47V24L37 12Z" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="m17 24 20 12 21-12M37 36v23" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="m37 12 21 12-21 12-20-12 20-12Z" fill="currentColor" fill-opacity=".18"/>
    <path d="M17 32v15l12 7V40L17 32Z" fill="currentColor" fill-opacity=".48"/>
  </svg>
  <h1>Pixel Reconstruction</h1>
  <p id="status">正在连接…</p>
  <button id="retry" type="button">重试</button>
</div>
<script>
  const SITE = 'https://pixel-reconstruction.netlify.app/';
  const status = document.getElementById('status');
  async function connect() {
    document.body.classList.remove('offline');
    status.textContent = '正在连接…';
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 20000));
    try {
      // 先确认站点可达，避免直接跳过去后停在浏览器的错误页
      await Promise.race([fetch(SITE, { mode: 'no-cors', cache: 'no-store' }), timeout]);
      location.replace(SITE);
    } catch {
      document.body.classList.add('offline');
      status.textContent = '暂时连不上服务器，请检查网络后重试。';
    }
  }
  document.getElementById('retry').addEventListener('click', connect);
  connect();
</script>
</body>
</html>
