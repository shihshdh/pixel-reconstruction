[build]
  command = "npm run build"
  publish = "out"

[[edge_functions]]
  path = "/scene-file/*"
  function = "scene-file"

# 「走进世界」国内中转（netlify/edge-functions/world-file.ts）：结果在边缘缓存
[[edge_functions]]
  path = "/world-file/*"
  function = "world-file"
  cache = "manual"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' blob: https: http://localhost:* http://127.0.0.1:* http://ipc.localhost; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# The landing scenes are requested as ?v=<version> (components/LandingSplat.tsx),
# so they can be cached for a year. Bump v= whenever a .ksplat changes.
[[headers]]
  for = "/scene/*.ksplat"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unversioned URLs keep a short cache so replacing them takes effect within a day.
[[headers]]
  for = "/scene/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/scene/scene-manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Companion model (unmodified files; see public/companion/whale/LICENSE-Live2D.txt). A week is plenty for
# a 4 MB asset that only changes when the model is replaced.
[[headers]]
  for = "/companion/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Windows 客户端安装包放在 GitHub Releases（每次发版多传一份固定文件名 PixelReconstruction-Setup.exe）。
# 以前分享出去的 /download/ 地址跳到最新版：走 gh-proxy.com 国内镜像（直连 github.com 国内常超时，见 lib/desktop.ts）。
[[redirects]]
  from = "/download/PixelReconstruction-Setup.exe"
  to = "https://gh-proxy.com/https://github.com/shihshdh/pixel-reconstruction/releases/latest/download/PixelReconstruction-Setup.exe"
  status = 302
  force = true
